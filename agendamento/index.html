<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta property="og:title" content="Lukiinha Cortes" />
<meta property="og:description" content="Agende seu horário. Seu próximo corte está a um clique. Agende agora!" />
<meta property="og:image" content="https://lukiinha.vercel.app/meta-logo.png" />
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="300">
<meta property="og:image:height" content="300">
<meta property="og:url" content="https://lukiinha.vercel.app/agendamento" />
<meta property="og:type" content="website" />
  <title>Lukiinha Cortes — Agendamento</title>
<meta property="og:title" content="Agendamento | LukiinhaCortes" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

  <script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <link rel="stylesheet" href="./css/components/agendamento.css">
</head>

<body>

  <div id="app"></div>

  <!-- Component scripts (modularized) -->
  <script src="./js/components/TypingIndicator.js"></script>
  <script src="./js/components/ServiceGrid.js"></script>
  <script src="./js/components/BarberRow.js"></script>
  <script src="./js/components/CalendarPicker.js"></script>
  <script src="./js/components/DateTimePicker.js"></script>
  <script src="./js/components/TimeSlots.js"></script>

  <script>
    const { createApp, ref, reactive, computed, nextTick, onMounted } = Vue;

    /* ===================== DATA ===================== */

    const SERVICES = [
      { id: 'corte', name: 'Corte', image: './img/corte.jpg', price: 20, duration: 30 },
      { id: 'barba', name: 'Barba', image: './img/barba.jpg', price: 15, duration: 20 },
      { id: 'combo', name: 'Corte + Barba', image: './img/combo.jpg', price: 35, duration: 50 },
      { id: 'sobrancelha', name: 'Sobrancelha', image: './img/sobrancelha.jpg', price: 5, duration: 10 },
    ];

    const SHOP_NAME = 'Lukiinha Cortes';

    const BARBERS = [
      { id: 'luktinha', name: 'Lukiinha', role: 'Fundador', photo: '' }
    ];

    const WEEKDAYS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

    /* ===================== SUB-COMPONENTS ===================== */

    /* Sub-components are now modularized into separate files under js/components/
       — they are loaded via <script> tags before this main app script. */

    /* ===================== MAIN APP ===================== */

    createApp({
      components: {
        TypingIndicator: window.TypingIndicator,
        ServiceGrid: window.ServiceGrid,
        BarberRow: window.BarberRow,
        CalendarPicker: window.CalendarPicker,
        DateTimePicker: window.DateTimePicker,
        TimeSlots: window.TimeSlots,
      },

      setup() {
        const loadingShell = ref(true);
        const starting = ref(false);
        const messages = ref([]);
        const isTyping = ref(false);
        const scrollEl = ref(null);
        const nameInput = ref('');
        const phoneInput = ref('');
        const phoneError = ref('');
        const menuOpen = ref(false);
        const menuEl = ref(null);
        const menuBtnEl = ref(null);
        const hasScrolledToSlots = ref(false);

        function toggleMenu() {
          menuOpen.value = !menuOpen.value;
        }

        function closeMenu() {
          menuOpen.value = false;
        }

        function onMenuEnter(el, done) {
          gsap.killTweensOf(el);
          gsap.fromTo(el,
            { opacity: 0, scale: 0.82, y: -14, filter: 'blur(6px)' },
            {
              opacity: 1, scale: 1, y: 0, filter: 'blur(0px)',
              duration: 0.55, ease: 'elastic.out(1, 0.75)', onComplete: done
            }
          );
          const items = el.querySelectorAll('.glass-menu-item');
          gsap.fromTo(items,
            { opacity: 0, x: 10 },
            { opacity: 1, x: 0, duration: 0.4, stagger: 0.06, delay: 0.12, ease: 'power3.out' }
          );
        }

        function onMenuLeave(el, done) {
          gsap.killTweensOf(el);
          gsap.to(el, {
            opacity: 0, scale: 0.85, y: -10, filter: 'blur(4px)',
            duration: 0.3, ease: 'power2.in', onComplete: done
          });
        }

        function goToBookings() {
          closeMenu();
          // Página "Meus agendamentos" ainda não implementada.
        }

        function restartFromMenu() {
          if (starting.value) return;
          closeMenu();
          restart();
        }

        function onDocClick(e) {
          if (!menuOpen.value) return;
          const t = e.target;
          if (menuEl.value && menuEl.value.contains(t)) return;
          if (menuBtnEl.value && menuBtnEl.value.contains(t)) return;
          closeMenu();
        }

        const booking = reactive({
          services: [],
          barber: null,
          date: null,
          time: null,
        });

        const customer = reactive({
          name: '',
          phone: '',
        });

        const stage = ref('greeting'); // greeting -> name -> service -> barber -> datetime -> phone -> done

        let msgId = 0;
        function nowLabel() {
          return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        async function scrollToBottom() {
          await nextTick();
          if (scrollEl.value) {
            scrollEl.value.scrollTo({ top: scrollEl.value.scrollHeight, behavior: 'smooth' });
          }
        }

        function scrollElementIntoViewInContainer(container, element, position = 'center') {
          if (!container || !element) return;
          try {
            const elRect = element.getBoundingClientRect();
            const contRect = container.getBoundingClientRect();
            const elTopRelative = elRect.top - contRect.top + container.scrollTop;
            let desiredTop;
            if (position === 'top') {
              desiredTop = elTopRelative - 12;
            } else { // center
              desiredTop = elTopRelative - (container.clientHeight / 2) + (element.clientHeight / 2);
            }
            container.scrollTo({ top: Math.max(0, Math.min(desiredTop, container.scrollHeight)), behavior: 'smooth' });
          } catch (err) {
            // fail silently
          }
        }

        function pushBot(text, opts = {}) {
          messages.value.push({
            id: ++msgId,
            from: 'bot',
            text,
            time: nowLabel(),
            widget: opts.widget || null,
            showAvatar: true,
          });
          scrollToBottom();
        }

        function pushUser(text) {
          messages.value.push({
            id: ++msgId,
            from: 'user',
            text,
            time: nowLabel(),
          });
          scrollToBottom();
        }

        async function botSay(text, opts = {}) {
          isTyping.value = true;
          await scrollToBottom();
          const delay = opts.delay ?? Math.min(1400, 400 + text.length * 12);
          await new Promise(r => setTimeout(r, delay));
          isTyping.value = false;
          pushBot(text, opts);
        }

        function fmtDate(d) {
          return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
        }
        function fmtDateShort(d) {
          return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
        }

        /* ---------- FLOW ---------- */

        async function startFlow() {
          starting.value = true;
          try {
            await botSay(`Olá, tudo bem? Sou a assistente virtual do(a) ${SHOP_NAME} e cuido do agendamento dos serviços dos profissionais dele(a), ok?`, { delay: 700 });
            await botSay('Qual o seu nome? Escreva seu nome e sobrenome, por favor.', { widget: 'nameInput', delay: 900 });
            stage.value = 'name';
          } finally {
            starting.value = false;
          }
        }

        function dismissLatestWidget() {
          const lastMessage = messages.value[messages.value.length - 1];
          if (lastMessage && lastMessage.widget) {
            lastMessage.widget = null;
          }
        }

        async function submitName() {
          const value = nameInput.value.trim();
          if (!value) return;

          dismissLatestWidget();
          customer.name = value;
          pushUser(value);
          nameInput.value = '';

          await botSay('Ótimo! Agora vamos escolher o serviço.', { widget: 'service', delay: 800 });
          stage.value = 'service';
        }

        function formatPhoneValue(raw) {
          const digits = raw.replace(/\D/g, '').slice(0, 11);
          if (digits.length <= 2) return digits;

          const area = digits.slice(0, 2);
          const local = digits.slice(2);

          if (local.length <= 4) {
            return `(${area}) ${local}`;
          }
          if (local.length <= 8) {
            return `(${area}) ${local.slice(0, 4)}-${local.slice(4)}`;
          }
          return `(${area}) ${local.slice(0, 5)}-${local.slice(5)}`;
        }

        let phoneErrorTimeout = null;

        function clearPhoneErrorAfterDelay() {
          if (phoneErrorTimeout) {
            clearTimeout(phoneErrorTimeout);
          }
          phoneErrorTimeout = setTimeout(() => {
            phoneError.value = '';
            phoneErrorTimeout = null;
          }, 5000);
        }

        function onPhoneInput(event) {
          const digits = event.target.value.replace(/\D/g, '');
          if (digits.length > 11) {
            const limited = digits.slice(0, 11);
            const formatted = formatPhoneValue(limited);
            event.target.value = formatted;
            phoneInput.value = formatted;
          } else {
            const formatted = formatPhoneValue(event.target.value);
            event.target.value = formatted;
            phoneInput.value = formatted;
          }
          if (event.target.value.replace(/\D/g, '').length >= 10) {
            phoneError.value = '';
          }
        }

        async function submitPhone() {
          const value = phoneInput.value.trim();
          if (!value) return;

          const digits = value.replace(/\D/g, '');
          if (digits.length < 8) {
            phoneError.value = 'Número de telefone inválido';
            clearPhoneErrorAfterDelay();
            return;
          }
          if (digits.length < 10) {
            phoneError.value = 'Número de telefone inválido, inclua o DDD';
            clearPhoneErrorAfterDelay();
            return;
          }

          const formatted = formatPhoneValue(value);
          dismissLatestWidget();
          customer.phone = formatted;
          pushUser(formatted);
          phoneInput.value = '';

          await confirmBooking();
        }

        function toggleService(service) {
          if (stage.value !== 'service') return;
          const index = booking.services.findIndex(s => s.id === service.id);
          if (index === -1) {
            booking.services.push(service);
          } else {
            booking.services.splice(index, 1);
          }
        }

        async function sendServices() {
          if (stage.value !== 'service' || booking.services.length === 0) return;
          dismissLatestWidget();
          const names = booking.services.map(s => s.name).join(', ');
          pushUser(names);

          if (BARBERS.length === 1) {
            booking.barber = BARBERS[0];
            await botSay(`Boa escolha. ${BARBERS[0].name} será seu barbeiro. Agora escolhe o dia e horário:`, { widget: 'datetime', delay: 800 });
            stage.value = 'datetime';
            return;
          }

          await botSay('Boa escolha. Com qual barbeiro você prefere?', { widget: 'barber', delay: 800 });
          stage.value = 'barber';
        }

        async function selectBarber(barber) {
          if (stage.value !== 'barber') return;
          booking.barber = barber;
          pushUser(barber.name);
          await botSay('Show! Agora escolhe o dia e horário:', { widget: 'datetime', delay: 800 });
          stage.value = 'datetime';
        }

        async function selectDate(date) {
          if (stage.value !== 'datetime') return;
          booking.date = date;
          await nextTick();

          // Smart scroll: bring time-slots area into view and ensure the "Enviar" button is visible.
          try {
            const container = scrollEl.value;
            if (!container) return;

            const slotsWrap = container.querySelector('.slots-wrap');
            const submitWrap = container.querySelector('.datetime-submit-wrap');

            if (slotsWrap) {
              // Scroll so slots are near the top of the visible area
              scrollElementIntoViewInContainer(container, slotsWrap, 'top');
            }

            // After the main scroll settles, ensure the submit button is visible (scroll further if needed)
            setTimeout(() => {
              if (!container || !submitWrap) return;
              try {
                const contRect = container.getBoundingClientRect();
                const submitRect = submitWrap.getBoundingClientRect();
                const margin = 12; // small breathing room

                // If the submit button bottom is below the container bottom, scroll down enough to reveal it
                if (submitRect.bottom > contRect.bottom - margin) {
                  const extra = submitRect.bottom - contRect.bottom + margin;
                  container.scrollBy({ top: Math.max(0, extra), behavior: 'smooth' });
                }
                // If the submit button is above the container top (rare), scroll up to it
                else if (submitRect.top < contRect.top + margin) {
                  const extra = submitRect.top - contRect.top - margin;
                  container.scrollBy({ top: Math.min(0, extra), behavior: 'smooth' });
                }
              } catch (e) {
                // ignore
              }
            }, 260);
          } catch (err) {
            // fail silently
          }
        }

        const timeSlots = computed(() => {
          const slots = [];
          const addSlots = (startHour, startMinute, endHour, endMinute) => {
            const cursor = new Date();
            cursor.setHours(startHour, startMinute, 0, 0);
            const end = new Date();
            end.setHours(endHour, endMinute, 0, 0);

            while (cursor < end) {
              const hours = String(cursor.getHours()).padStart(2, '0');
              const minutes = String(cursor.getMinutes()).padStart(2, '0');
              slots.push({ time: `${hours}:${minutes}`, full: false });
              cursor.setMinutes(cursor.getMinutes() + 40);
            }
          };

          addSlots(8, 0, 11, 30);
          addSlots(14, 0, 18, 0);

          if (!booking.date) {
            return slots;
          }

          const now = new Date();
          const isToday = booking.date.toDateString() === now.toDateString();

          if (!isToday) {
            return slots;
          }

          return slots.filter(slot => {
            const [hours, minutes] = slot.time.split(':').map(Number);
            const slotDate = new Date(now);
            slotDate.setHours(hours, minutes, 0, 0);
            return slotDate > now;
          });
        });

        const totalPrice = computed(() => booking.services.reduce((sum, service) => sum + service.price, 0));

        async function selectTime(time) {
          if (stage.value !== 'datetime') return;
          booking.time = time;
        }

        async function submitDateTime() {
          if (stage.value !== 'datetime') return;
          if (!booking.date || !booking.time) return;
          dismissLatestWidget();
          const choiceLabel = `${fmtDate(booking.date)} às ${booking.time}`;
          pushUser(choiceLabel);
          await botSay('Perfeito! Agora me diz seu número de telefone para te avisar sobre o agendamento.', { widget: 'phoneInput', delay: 800 });
          stage.value = 'phone';
          await nextTick();
          const phoneEl = document.getElementById('customer-phone');
          scrollElementIntoViewInContainer(scrollEl.value, phoneEl, 'top');
        }

        async function confirmBooking() {
          await new Promise(r => setTimeout(r, 800));
          await botSay('Agendamento confirmado! Te espero lá 💈', { widget: 'success', delay: 900 });
          stage.value = 'done';
        }

        function restart() {
          if (starting.value) return;
          starting.value = true;
          messages.value = [];
          booking.services = [];
          booking.barber = null;
          booking.date = null;
          booking.time = null;
          customer.name = '';
          customer.phone = '';
          nameInput.value = '';
          phoneInput.value = '';
          hasScrolledToSlots.value = false;
          stage.value = 'greeting';
          startFlow();
        }

        onMounted(async () => {
          document.addEventListener('click', onDocClick, true);
          document.addEventListener('touchstart', onDocClick, true);
          await new Promise(r => setTimeout(r, 1400));
          loadingShell.value = false;
          startFlow();
        });

        return {
          loadingShell, starting, messages, isTyping, scrollEl,
          booking, customer, stage, timeSlots,
          nameInput, phoneInput, phoneError,
          submitName, submitPhone, onPhoneInput,
          toggleService, sendServices, selectBarber, selectDate, selectTime, submitDateTime,
          confirmBooking, restart,
          fmtDate, fmtDateShort,
          totalPrice,
          SERVICES, BARBERS,
          menuOpen, menuEl, menuBtnEl, toggleMenu, closeMenu,
          onMenuEnter, onMenuLeave, goToBookings, restartFromMenu,
        };
      },

      template: `
    <div class="shell">

      <!-- HEADER -->
      <header class="chat-header" v-if="!loadingShell">
        <a class="header-back" href="../index.html" aria-label="Voltar para a página inicial">
          <i class="ri-arrow-left-line"></i>
        </a>
        <div class="logo-wrap">
          <img src="../../logo.webp" alt="Lukiinha Cortes Logo" class="logo-image">
          <div class="status-indicator">
            <span class="status-dot-inline"></span>
            <transition name="fade" mode="out-in">
              <span v-if="isTyping" class="typing-inline" key="t">digitando...</span>
              <span v-else key="o">online</span>
            </transition>
          </div>
        </div>
        <div class="header-menu-wrap">
          <button
            class="header-action"
            :class="{ active: menuOpen }"
            ref="menuBtnEl"
            type="button"
            aria-label="Mais opções"
            :aria-expanded="menuOpen"
            @click.stop="toggleMenu"
          >
            <i class="ri-more-2-fill"></i>
          </button>

          <transition @enter="onMenuEnter" @leave="onMenuLeave" :css="false">
            <div v-if="menuOpen" class="glass-menu" ref="menuEl" role="menu">
              <div class="glass-menu-sheen"></div>
              <button class="glass-menu-item" role="menuitem" type="button" @click="goToBookings">
                <span class="glass-menu-icon"><i class="ri-calendar-check-line"></i></span>
                <span class="glass-menu-label">Meus agendamentos</span>
              </button>
              <div class="glass-menu-divider"></div>
              <button class="glass-menu-item danger" role="menuitem" type="button" :disabled="starting" :aria-disabled="starting" @click="restartFromMenu">
                <span class="glass-menu-icon"><i class="ri-restart-line"></i></span>
                <span class="glass-menu-label">Reiniciar</span>
              </button>
            </div>
          </transition>
        </div>
      </header>

      <!-- HEADER SKELETON -->
      <header class="skel-header" v-else>
        <div class="skeleton skel-avatar"></div>
        <div class="skel-lines">
          <div class="skeleton skel-line" style="width:55%"></div>
          <div class="skeleton skel-line" style="width:35%;margin-bottom:0"></div>
        </div>
      </header>

      <div class="scroll-fade" v-if="!loadingShell"></div>

      <!-- MESSAGES -->
      <main class="messages" ref="scrollEl" v-if="!loadingShell">
        <div class="day-divider">Hoje</div>

        <transition-group name="msg" tag="div">
          <template v-for="(m, idx) in messages" :key="m.id">

            <div class="row" :class="m.from">
              <div class="row-avatar-spacer" v-if="m.from==='bot'"></div>
              <div class="bubble-col">
                <div class="bubble" :class="m.from">
                  {{ m.text }}
                  <span class="meta-time">{{ m.time }}</span>
                </div>
              </div>
            </div>

            <!-- Inline widgets attached to a bot message. They stay visible after
                 a choice is made (showing the selection), but become inert. -->
            <form v-if="m.widget === 'nameInput'" class="inline-form" @submit.prevent="submitName">
              <div class="inline-input-row">
                <input id="customer-name" v-model="nameInput" type="text" placeholder="Seu nome e sobrenome" autocomplete="off" spellcheck="false" required>
                <button type="submit" class="inline-submit-btn">Enviar</button>
              </div>
            </form>

            <form v-if="m.widget === 'phoneInput'" class="inline-form" @submit.prevent="submitPhone">

              <div class="inline-input-row">
                <div class="phone-input-wrapper">
                  <span class="phone-flag"><img src="./img/brasil-flag.png" alt="Brasil"></span>
                  <input id="customer-phone" v-model="phoneInput" @input="onPhoneInput" type="tel" inputmode="tel" placeholder="(11) 99999-9999" autocomplete="off" spellcheck="false" maxlength="17" required>
                </div>
                <button type="submit" class="inline-submit-btn">Enviar</button>
              </div>              <p v-if="phoneError" class="input-error-message">{{ phoneError }}</p>            </form>

            <ServiceGrid
              v-if="m.widget === 'service'"
              class="widget-locked"
              :class="{ 'widget-locked': stage !== 'service' }"
              :services="SERVICES"
              :selectedIds="booking.services.map(s => s.id)"
              :locked="stage !== 'service'"
              @toggle="toggleService"
            />
            <div v-if="m.widget === 'service'" class="service-actions">
              <button type="button" class="send-services-btn" :disabled="booking.services.length === 0" @click="sendServices">
                Enviar ({{ booking.services.length }})
              </button>
            </div>

            <BarberRow
              v-if="m.widget === 'barber'"
              :barbers="BARBERS"
              :selectedId="booking.barber?.id"
              :locked="stage !== 'barber'"
              @select="selectBarber"
            />

            <DateTimePicker
              v-if="m.widget === 'datetime'"
              :selectedDate="booking.date"
              :selectedTime="booking.time"
              :timeSlots="timeSlots"
              :locked="stage !== 'datetime'"
              @selectDate="selectDate"
              @selectTime="selectTime"
              @submitDateTime="submitDateTime"
            />



            <div class="row bot" v-if="m.widget === 'success'">
              <div class="row-avatar-spacer"></div>
              <div class="bubble-col">
                <div class="bubble bot success-bubble">
                  <div>{{ customer.name }}, seu agendamento de {{ booking.services.map(s => s.name).join(', ') }} com {{ booking.barber?.name }} foi confirmado para {{ fmtDateShort(booking.date) }} às {{ booking.time }}. ✅</div>
                  <span class="meta-time">{{ m.time }}</span>
                </div>
              </div>
            </div>

            <div class="success-actions" v-if="m.widget === 'success'">
              <button class="success-action-btn" @click="goToBookings">
                Meus agendamentos
              </button>
              <button class="success-action-btn" @click="restart">
                Novo agendamento
              </button>
              <button class="success-action-btn" @click="goToBookings">
                Cancelar agendamento
              </button>
            </div>

          </template>
        </transition-group>

        <transition name="fade">
          <TypingIndicator v-if="isTyping" />
        </transition>

      </main>

      <!-- MESSAGES SKELETON -->
      <main class="messages" v-else>
        <div class="skel-msg-row">
          <div class="skeleton skel-avatar-sm"></div>
          <div class="skeleton skel-bubble" style="width:60%"></div>
        </div>
        <div class="skel-msg-row">
          <div class="skeleton skel-avatar-sm"></div>
          <div class="skeleton skel-bubble" style="width:75%"></div>
        </div>
        <div class="skel-cards">
          <div class="skeleton skel-card"></div>
          <div class="skeleton skel-card"></div>
          <div class="skeleton skel-card"></div>
          <div class="skeleton skel-card"></div>
        </div>
      </main>

    </div>
  `
    }).mount('#app');
  </script>
</body>

</html>
